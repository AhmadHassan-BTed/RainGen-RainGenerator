[package]
name = "raingen_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Native real-time synthesis core of the raingen weather sound engine"
license = "MIT"
publish = false

[lib]
name = "raingen_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["abi3-py310", "extension-module"] }
numpy = "=0.30.0"
cpal = "=0.18.2"
rayon = "=1.12.0"
rtrb = "=0.4.1"
crossbeam-channel = "=0.5.17"
crossbeam-queue = "=0.3.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
realfft = "=3.5.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "unwind"

[profile.dev]
opt-level = 1
