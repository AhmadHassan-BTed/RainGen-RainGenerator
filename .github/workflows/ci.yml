name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# a newer push to the same branch / PR supersedes a running check
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      # headless pygame (the legacy app) and no audio device needed
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      # renders are many small array operations per block: pooled BLAS/OpenMP threads only
      # oversubscribe the runner's cores
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # a crash in a C extension (PortAudio, SDL, libsndfile) prints a traceback
      PYTHONFAULTHANDLER: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 libsndfile1 libasound2-dev libsdl2-dev

    # requirements-dev.txt pulls in requirements.txt (numpy, scipy, sounddevice, soundfile,
    # pygame) plus pytest and the optional raingen features tests/raingen exercises (pyyaml,
    # python-osc). On Windows the sounddevice and soundfile wheels bundle PortAudio / libsndfile.
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt
        python -m pip install -e .

    - name: Show resolved versions
      run: python -m pip list

    # catches syntax newer than the matrix Python (3.12 f-strings, PEP 695 ...) before any test runs
    - name: Byte-compile every module on this Python
      run: python -m compileall -q raingen rain_generator tests thunderstorm_simulator.py

    - name: Run test suite (fast tier)
      run: python -m pytest tests -m "not slow" --durations=25 -o faulthandler_timeout=900

  slow:
    # the long renders and sweeps (@pytest.mark.slow): on demand, one configuration
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONFAULTHANDLER: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 libsndfile1 libasound2-dev libsdl2-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt
        python -m pip install -e .

    - name: Run test suite (slow tier)
      run: python -m pytest tests -m slow --durations=25 -o faulthandler_timeout=3600
